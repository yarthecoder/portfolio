<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Comment Cards</title>
  </head>
  
  <body>
    <main>
      <section id="heading">
      <h2>3. Comment Cards</h2>
      <button id="expandBtn">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
      </section>
      <p>
        The scalable comment card function.
      </p>


      <!---------------------------------->
      <!----- Demostration Section ------->
      <div id="demoCanvasBody">
        <section class="commentSection">
          <header class="buttonArea">
            <span>1M</span>
            <button><i class="fa-solid fa-heart"></i></button>

            <span class="commentCount">0</span>
            <button class="commentButton"><i class="fa-solid fa-comment"></i></button>

            <span>5K</span>
            <button><i class="fa-solid fa-share"></i></button>

            <span>5M</span>
            <button><i class="fa-solid fa-eye"></i></button>
          </header>
          <section class="commentBox"></section>
        </section>

      </div>


      <!---------------------------->
      <!----- Commit Section ------->
      <section class="commitSection">
        <span>
          Source:
          <a href="index.html" target="_blank">HTML</a>,
          <a href="style.css" target="_blank">CSS</a>,
          <a href="script.js" target="_blank">JS</a>.
        </span>
        <span>
          Version?
        </span>
      </section>

      <section class="commitSection"> 
        <span id="Commit">Project Commit: Date</span>
        <span> 
          <button class="readHideBtn">Read More ▼</button>
        </span>
      </section>
      

      <section id="readMore">
        <h2>What I learned from this Project</h2>

        <p>
          
        </p>

        <button class="readHideBtn">Hide ▲</button>
      </section>

    </main>
    <script src="script.js"></script>
  </body>

</html>
