<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>new playground</title>
</head>
<body>


<main>

    <!--  Heading and Description ---------- -->

    <h2>Your Title</h2>

    <p>
        Your Description
    </p>

    <!-- ------- ------- ------- -->
    <!-- ------- ------- ------- -->


    <!-- Demo Body-main  ----- -->

    <div class="demoCanvas">

       <h2>Your Demo Project</h2>

    </div>

    <!-- ------- ------- ------- -->
    <!-- ------- ------- ------- -->









    <!-- Like and Comment Section -->

    <p id="sourceFiles">
        Source 📁: <a href="index.html" target="_blank">HTML</a>,
        <a href="style.css" target="_blank">CSS</a>,
        <a href="script.js" target="_blank">JS</a>.
    </p>

    <p id="Commit">Project Commit: Date</p>

    <section class="reaction">

        <span id="likeCount">79</span >
        <button id="likeBtn">🤍</button>
        
        <span id="commentCount">3</span > 
        <button id="commentBtn">💬</button>

        <span id="shareCount">69</span > 
        <button id="shareBtn"><i class="fa-solid fa-share"></i></button>

        <span id="saveCount">99</span>
        <button id="saveBtn"><i class="fa-solid fa-bookmark"></i></button>

        <span id="viewerCount">999</span>
        <button id="viewer">👀</button>
    
    </section>

    <section id="commentSection">

        <input type="text" placeholder="Enter your comment..." id="commentInput">
        <button id="commentSubmitBtn"> <i class="fa-solid fa-paper-plane"></i> </button>

        <ul id="commentList">
            <li>Awesome!</li>
            <li>Love it!</li>
            <li>This is the perfect demo I had ever seen!</li>
        </ul>

    </section>
    
</main>

<script src="script.js"></script>
